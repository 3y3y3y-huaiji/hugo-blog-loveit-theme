name: CI & Code Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  theme-check:
    name: Theme Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js (Latest LTS)
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm run lint

      - name: TypeScript Typecheck
        run: pnpm run typecheck

      - name: Build Theme Assets
        run: pnpm run build:theme

  hugo-build-check:
    name: Hugo Site Build Test
    runs-on: ubuntu-latest
    needs: theme-check
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js (Latest LTS)
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Theme Assets
        run: pnpm run build:theme

      - name: Setup Hugo Extended (matches Cloudflare Pages)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.140.0'
          extended: true

      - name: Verify Hugo Build
        run: hugo --gc --minify

  link-check:
    name: Site Link Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Hugo Extended (matches Cloudflare Pages)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.140.0'
          extended: true

      - name: Build Site
        run: hugo --gc --minify

      - name: Set Lychee Root Directory
        run: echo "LYCHEE_ROOT=$GITHUB_WORKSPACE/public" >> "$GITHUB_ENV"

      - name: Check Links with Lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --exclude-all-private --exclude "mailto:" --exclude "sumingkai.de5.net" --exclude "openai.com" --exclude "website-datenbank.de" --exclude "archive" --exclude-path "public/archive" --exclude-path "public/robots.txt" --max-retries 3 --retry-wait-time 2 --timeout 20 --root-dir "${{ env.LYCHEE_ROOT }}" public
          fail: true
