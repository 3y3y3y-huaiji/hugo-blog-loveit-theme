name: Weekly GitHub Report

on:
    schedule:
        # 每周一 08:00 北京时间（周一 00:00 UTC），汇总上一个完整自然周
        - cron: '0 0 * * 1'
    workflow_dispatch:

concurrency:
    group: weekly-report
    cancel-in-progress: false

jobs:
    report:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: write
            actions: write
        env:
            NVIDIA_API_KEY_1: ${{ secrets.NVIDIA_API_KEY }}
            NVIDIA_API_KEY_2: ${{ secrets.NVIDIA_API_KEY_2 }}
            NVIDIA_API_KEY_3: ${{ secrets.NVIDIA_API_KEY_3 }}
            GH_TOKEN: ${{ secrets.GH_PAT }}
            WEEKLY_PR_TOKEN: ${{ secrets.WEEKLY_PR_TOKEN }}
            GITHUB_USER: 3y3y3y-huaiji

        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11.22.0

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version-file: .ci-node-version
                  cache: pnpm

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Build Scripts
              run: pnpm run build:scripts

            # 至少配置一把 NVIDIA key；多把 key 时由下一步按顺序探测。
            - name: Check Secrets
              run: |
                  found=0
                  for name in NVIDIA_API_KEY_1 NVIDIA_API_KEY_2 NVIDIA_API_KEY_3; do
                    if [ -n "${!name}" ]; then found=1; fi
                  done
                  [ "$found" = "1" ] || { echo "缺少 NVIDIA_API_KEY（或 NVIDIA_API_KEY_2/3）"; exit 1; }
                  [ -n "$GH_TOKEN" ] || { echo "缺少 GH_PAT（公开仓库只读 PAT）"; exit 1; }
                  [ -n "$WEEKLY_PR_TOKEN" ] || { echo "缺少 WEEKLY_PR_TOKEN（仅本仓库 Pull requests 读写的 fine-grained PAT）"; exit 1; }

            - name: Select Available NVIDIA Key
              run: node dist/select-nvidia-key.js

            - name: Install OpenCode CLI
              run: npm install -g --allow-scripts=@opencode/cli @opencode/cli@2.2.7

            - name: Generate Weekly Report
              run: pnpm run report:weekly

            # 周报必须满足 TOML front matter、周报标签、非空描述与正文等契约。
            - name: Verify Generated Content
              run: pnpm run verify:content

            - name: Create Weekly Report PR
              env:
                  GH_TOKEN: ${{ secrets.WEEKLY_PR_TOKEN }}
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"

                  if [ -z "$(git status --porcelain content/posts/)" ]; then
                    echo "本周没有新周报，跳过提交。"
                    exit 0
                  fi

                  file=$(git status --porcelain content/posts/ | awk '{print $2}' | head -n1)
                  label=$(basename "$file" .md | sed 's/^weekly-//')
                  branch="weekly-report/${label}"

                  echo "检测到新周报：$file"
                  git checkout -B "$branch"
                  git add content/posts/
                  git commit -m "chore: add weekly GitHub report ${label}"
                  git push --force-with-lease origin "$branch"

                  existing=$(gh pr list --head "$branch" --json number --jq '.[0].number')
                  if [ -z "$existing" ]; then
                    gh pr create \
                      --base main \
                      --head "$branch" \
                      --title "chore: weekly report ${label}" \
                      --body "自动生成的周报：\`${file}\`。请等待 CI 通过后合并。"
                  else
                    echo "PR #$existing 已存在，已更新分支。"
                    # 分支由 GITHUB_TOKEN 推送，不会触发 pull_request workflow，补跑一次 CI。
                    GH_TOKEN="${{ github.token }}" gh workflow run ci.yml --ref "$branch"
                  fi
