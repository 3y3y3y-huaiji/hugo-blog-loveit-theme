name: Smoke

on:
    workflow_dispatch:
        inputs:
            origin:
                description: 目标站点
                required: false
                # 默认打自定义域；被 Cloudflare 机器人规则拦截时改填 workers.dev 地址。
                default: https://hugo-blog-loveit-theme.pages.dev
    schedule:
        # 每天 01:00 UTC 巡检一次，捕捉证书、路由、静态资源的静默回归。
        - cron: '0 1 * * *'

permissions:
    contents: read

jobs:
    smoke:
        name: 线上冒烟
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            # scripts 现在是 TypeScript，需要安装依赖并编译到 dist/ 后再冒烟。
            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11.22.0
            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version-file: .ci-node-version
                  cache: 'pnpm'
            - name: Install Dependencies
              run: pnpm install --frozen-lockfile
            - name: Build Scripts
              run: pnpm run build:scripts
            - name: 探测主站
              run: pnpm run smoke
              env:
                  SITE_ORIGIN: ${{ inputs.origin || 'https://hugo-blog-loveit-theme.pages.dev' }}
