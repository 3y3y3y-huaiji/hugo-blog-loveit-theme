baseURL = 'https://berry.ccwu.cc/'
locale = 'zh-cn'
title = '安卓人'
theme = 'LoveIt'
enableRobotsTXT = true
hasCJKLanguage = true

[params]
  version = "0.3.X"
  fingerprint = "sha256"
  mainSections = ["posts"]
  description = "安卓人的个人技术博客，记录形式化数学 (Lean 4)、几何深度学习架构与系统工程实践。"
  keywords = ["安卓人", "Lean 4", "形式化数学", "Mathlib4", "几何深度学习", "Mobius Attention", "系统工程"]
  
  [params.author]
    name = "安卓人"
    email = "sumingkai1@outlook.com"
    link = "https://github.com/3y3y3y-huaiji"
  
  [params.search]
    enable = true
    type = "lunr"
    contentLength = 10000
    placeholder = "搜索文章..."
    maxResultLength = 50
    snippetLength = 300
    highlightTag = "em"
    absoluteURL = false
  
  [params.header]
    desktopMode = "fixed"
    mobileMode = "auto"
    themeChangeMode = "switch"
    [params.header.title]
      logo = ""
      name = "安卓人"
      pre = ""
      post = ""
  
  [params.footer]
    enable = true
    custom = ''
    hugo = true
    copyright = true
    author = true
    since = 2025
    icp = ""
    license = '<a rel="license external nofollow noopener noreffer" href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank">CC BY-NC 4.0</a>'
  
  [params.section]
    paginate = 20
    dateFormat = "01-02"
    rss = 10
  
  [params.list]
    paginate = 20
    dateFormat = "01-02"
    rss = 10
  
  [params.home]
    rss = 10
    [params.home.profile]
      enable = true
      gravatarEmail = ""
      avatarURL = "images/avatar.webp"
      title = "安卓人"
      subtitle = "形式化数学 (Lean 4) · 几何深度学习架构 · 系统工程"
      typeit = false
      social = true
      disclaimer = ""
    [params.home.posts]
      enable = true
      paginate = 8

  [params.social]
    GitHub = "3y3y3y-huaiji"
    Email = "sumingkai1@outlook.com"

  [params.page.math]
    enable = true

[params.page.comment]
  enable = true
  [params.page.comment.giscus]
    enable = true
    repo = "3y3y3y-huaiji/Giscus-Comment-Repository"
    repoId = "R_kgDOQXU1Sg"
    category = "Announcements"
    categoryId = "DIC_kwDOQXU1Ss4Cx4Z7"
    lang = "zh-CN"
    mapping = "title"
    reactionsEnabled = "1"
    emitMetadata = "1"
    inputPosition = "top"
    lazyLoading = true
    lightTheme = "github-light"
    darkTheme = "github-dark"

[menu]
  [[menu.main]]
    weight = 1
    identifier = "posts"
    name = "文章"
    url = "/posts/"
  [[menu.main]]
    weight = 2
    identifier = "tags"
    name = "标签"
    url = "/tags/"
  [[menu.main]]
    weight = 3
    identifier = "categories"
    name = "分类"
    url = "/categories/"
  [[menu.main]]
    weight = 4
    identifier = "archive"
    name = "归档"
    url = "/archive/"
  [[menu.main]]
    weight = 5
    identifier = "about"
    name = "关于"
    url = "/about/"

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    lineNumbersInTable = true
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.extensions]
      definitionList = true
      footnote = true
      linkify = true
      strikethrough = true
      table = true
      taskList = true
      typographer = true
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 6
    ordered = false

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[permalinks]
  posts = "/:year/:month/:day/:filename/"
  tags = "/tags/:slug/"
  categories = "/categories/:slug/"

[privacy]
  [privacy.googleAnalytics]
    anonymizeIP = true
    disable = true
    respectDoNotTrack = true
    useSessionStorage = false
  [privacy.x]
    disable = true
    enableDNT = true
    simple = false
  [privacy.youtube]
    disable = true
    enhancedPrivacy = true
  [privacy.msClarity]
    disable = true

[mediaTypes]
  [mediaTypes."text/plain"]
    suffixes = ["md"]

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML"]

[params.cdn]
  data = "jsdelivr.yml"

[params.static]
  [params.static.lunr]
    target = "lib/lunr"
    include = "*.js"
