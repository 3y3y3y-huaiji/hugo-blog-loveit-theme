baseURL = 'https://hugo-blog-loveit-theme.pages.dev/'
locale = 'zh-CN'
defaultContentLanguage = 'zh-CN'
title = '安卓人的技术周记'
theme = 'LoveIt'
enableRobotsTXT = true
hasCJKLanguage = true

[languages]
  [languages.zh-CN]
    locale = 'zh-CN'
    label = '简体中文'
    weight = 1

[params]
  version = "0.3.X"
  fingerprint = "sha256"
  mainSections = ["posts"]
  title = "安卓人的技术周记"
  description = "记录我每周在 GitHub 上的代码、PR、踩坑与思考，由 OpenCode CLI 接入 NVIDIA GLM 5.3 Flash 协助整理。"
  keywords = ["个人博客", "技术周报", "GitHub", "开源", "工程复盘", "GLM"]
  images = ["images/og-cover.png"]
  
  [params.author]
    name = "安卓人"
    email = "sumingkai1@outlook.com"
    link = "https://github.com/3y3y3y-huaiji"
  
  [params.app]
    title = "安卓人的技术周记"
    themeColor = "#ffffff"
    tileColor = "#f5f5f5"
    iconColor = "#5bbad5"

  [params.seo]
    image = "images/og-cover.png"
    thumbnailUrl = "images/avatar.webp"

  [params.search]
    enable = true
    type = "lunr"
    contentLength = 3000
    placeholder = "搜索文章..."
    maxResultLength = 50
    snippetLength = 300
    highlightTag = "em"
    absoluteURL = false
  
  [params.header]
    desktopMode = "fixed"
    mobileMode = "auto"
    themeChangeMode = "switch"
    [params.header.title]
      logo = ""
      name = "安卓人的技术周记"
      pre = ""
      post = ""
  
  [params.footer]
    enable = true
    custom = ''
    hugo = true
    copyright = true
    author = true
    since = 2025
    icp = ""
    license = '<a rel="license external nofollow noopener noreffer" href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank">CC BY-NC 4.0</a>'
  
  [params.section]
    paginate = 20
    dateFormat = "01-02"
    rss = 10
  
  [params.list]
    paginate = 20
    dateFormat = "01-02"
    rss = 10
  
  [params.home]
    rss = 10
    [params.home.profile]
      enable = true
      gravatarEmail = ""
      avatarURL = "images/avatar.webp"
      title = "安卓人的技术周记"
      subtitle = "记录代码、PR 与每周折腾 | 由 GLM 5.3 Flash 协助整理"
      typeit = false
      social = true
      disclaimer = ""
    [params.home.posts]
      enable = true
      paginate = 8

  [params.social]
    GitHub = "3y3y3y-huaiji"
    Email = "sumingkai1@outlook.com"

  [params.page.math]
    enable = true

[params.page.comment]
  enable = true
  [params.page.comment.giscus]
    enable = true
    repo = "3y3y3y-huaiji/Giscus-Comment-Repository"
    repoId = "R_kgDOQXU1Sg"
    category = "Announcements"
    categoryId = "DIC_kwDOQXU1Ss4Cx4Z7"
    lang = "zh-CN"
    mapping = "title"
    reactionsEnabled = "1"
    emitMetadata = "1"
    inputPosition = "top"
    lazyLoading = true
    lightTheme = "github-light"
    darkTheme = "github-dark"

[menu]
  [[menu.main]]
    weight = 1
    identifier = "posts"
    name = "文章"
    url = "/posts/"
  [[menu.main]]
    weight = 2
    identifier = "tags"
    name = "标签"
    url = "/tags/"
  [[menu.main]]
    weight = 3
    identifier = "categories"
    name = "分类"
    url = "/categories/"
  [[menu.main]]
    weight = 4
    identifier = "archive"
    name = "归档"
    url = "/archive/"
  [[menu.main]]
    weight = 5
    identifier = "about"
    name = "关于"
    url = "/about/"

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    lineNumbersInTable = true
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.extensions]
      definitionList = true
      footnote = true
      linkify = true
      strikethrough = true
      table = true
      taskList = true
      typographer = true
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 6
    ordered = false

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[permalinks]
  posts = "/:year/:month/:day/:filename/"
  tags = "/tags/:slug/"
  categories = "/categories/:slug/"

[privacy]
  [privacy.googleAnalytics]
    anonymizeIP = true
    disable = true
    respectDoNotTrack = true
    useSessionStorage = false
  [privacy.x]
    disable = true
    enableDNT = true
    simple = false
  [privacy.youtube]
    disable = true
    enhancedPrivacy = true
  [privacy.msClarity]
    disable = true

[mediaTypes]
  [mediaTypes."text/plain"]
    suffixes = ["md"]

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML"]

[params.cdn]
  # 留空表示使用主题内置的本地静态资源，避免第三方 CDN 在境内不稳定。
  data = ""

[params.static]
  [params.static.lunr]
    target = "lib/lunr"
    include = "*.js"
